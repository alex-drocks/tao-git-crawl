services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pin git-crawl to a specific ref if desired.
        GIT_CRAWL_URL: "git+https://github.com/alex-drocks/git-crawl.git@v0.3.2"
    restart: unless-stopped
    environment:
      # Required — set in .env or inline.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}

      # Scheduler timing.
      TAO_CRAWL_INTERVAL_SECONDS: "${TAO_CRAWL_INTERVAL_SECONDS:-86400}"

      # Crawl settings.
      TAO_CRAWL_NETWORK: "${TAO_CRAWL_NETWORK:-finney}"
      TAO_CRAWL_OUTPUT_DIR: "/data/output"
      TAO_CRAWL_CACHE_DIR: "/data/cache"
      TAO_CRAWL_INCREMENTAL: "${TAO_CRAWL_INCREMENTAL:-false}"
      TAO_CRAWL_STATE_DB: "${TAO_CRAWL_STATE_DB:-/data/state/db.sqlite}"
      TAO_CRAWL_WORKERS: "${TAO_CRAWL_WORKERS:-4}"
      TAO_CRAWL_WINDOW_DAYS: "${TAO_CRAWL_WINDOW_DAYS:-365}"
      TAO_CRAWL_SINCE: "${TAO_CRAWL_SINCE:-}"
      TAO_CRAWL_COMMIT_CHANGES_FILTRATION_LEVEL: "${TAO_CRAWL_COMMIT_CHANGES_FILTRATION_LEVEL:-source_like}"
      TAO_CRAWL_LOG_DIR: "/data/logs"
      TAO_CRAWL_RUN_ON_START: "${TAO_CRAWL_RUN_ON_START:-true}"

      # Optional remote registry URL.
      TAO_CRAWL_REGISTRY_URL: "${TAO_CRAWL_REGISTRY_URL:-}"

      # Optional local overrides.
      TAO_CRAWL_REGISTRY: "${TAO_CRAWL_REGISTRY:-}"
      TAO_CRAWL_CONFIG: "${TAO_CRAWL_CONFIG:-}"
    volumes:
      - tao-data:/data
      # Mount a local registry or config if you use the optional env vars above.
      # - ./registry.json:/data/registry.json:ro
      # - ./config.py:/data/config.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import tao_git_crawl.scheduler; tao_git_crawl.scheduler.healthcheck()"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_CRAWL_URL: "git+https://github.com/alex-drocks/git-crawl.git@v0.3.2"
    restart: unless-stopped
    entrypoint: ["python", "-m", "tao_git_crawl.api"]
    environment:
      TAO_API_OUTPUT_DIR: "/data/output"
      TAO_API_HOST: "0.0.0.0"
      TAO_API_PORT: "8080"
      TAO_API_CORS_ORIGIN: "${TAO_API_CORS_ORIGIN:-*}"
      TAO_API_RATE_LIMIT_REQUESTS: "${TAO_API_RATE_LIMIT_REQUESTS:-1200}"
      TAO_API_RATE_LIMIT_WINDOW_SECONDS: "${TAO_API_RATE_LIMIT_WINDOW_SECONDS:-60}"
    ports:
      - "${TAO_API_BIND_HOST:-127.0.0.1}:${TAO_API_PORT:-8080}:8080"
    volumes:
      - tao-data:/data:ro
    depends_on:
      - scheduler
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tao-data:
